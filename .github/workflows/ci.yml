name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Bump version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' player.xcodeproj/project.pbxproj | awk '{print $3}' | tr -d ';')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          xcrun agvtool new-marketing-version "$NEW_VERSION"

      - name: Run tests
        run: |
          xcodebuild test \
            -project player.xcodeproj \
            -scheme player \
            -destination 'platform=macOS' \
            -only-testing:playerTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild test \
              -project player.xcodeproj \
              -scheme player \
              -destination 'platform=macOS' \
              -only-testing:playerTests \
              CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project player.xcodeproj \
            -scheme player \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          APP_PATH=$(find build/DerivedData -name "player.app" -type d | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/player.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: player-${{ github.sha }}
          path: build/player.zip
          retention-days: 14

      - name: Commit version bump and tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add player.xcodeproj/project.pbxproj
          git commit -m "Bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push origin main "v$NEW_VERSION"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh release create "v$NEW_VERSION" \
            build/player.zip \
            --title "v$NEW_VERSION" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
